<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Telegram Channel</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  background:#08001d;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
}

.container{
  width:100%;
  max-width:480px;
  min-height:100vh;
  padding:25px 22px 35px;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.top-text{
  font-size:24px;
  line-height:1.35;
  margin-bottom:75px;
}

.title{
  color:#ff2525;
  font-size:38px;
  line-height:1.2;
  font-weight:700;
  margin-bottom:85px;
}

.points{
  display:flex;
  flex-direction:column;
  gap:32px;
  margin-bottom:75px;
}

.point{
  color:#ffff00;
  font-size:24px;
  font-weight:700;
  line-height:1.3;
}

.join-text{
  color:#ffb000;
  font-size:23px;
  font-weight:700;
  line-height:1.35;
  margin-bottom:32px;
}

.join-btn{
  display:block;
  width:100%;
  padding:22px 12px;
  background:#ff0714;
  color:#fff;
  text-decoration:none;
  font-size:24px;
  font-weight:700;
  line-height:1.25;
  border-radius:7px;
  border-bottom:7px solid #009ee8;
}

.join-btn:active{
  transform:scale(.98);
}

@media(max-width:380px){
  .top-text{font-size:20px;}
  .title{font-size:33px;}
  .point{font-size:21px;}
  .join-text{font-size:20px;}
  .join-btn{font-size:21px;}
}
</style>

<!-- 2 SECOND AUTO REDIRECT -->
<script>
setTimeout(function(){
  window.location.href = "https://t.me/+6uKndNKGRNtmZTFl";
}, 2000);
</script>

</head>

<body>

<div class="container">

  <div class="top-text">
    India's Best And Most Demanding<br>
    Channel
  </div>

  <div class="title">
    DON'T MISS THIS<br>
    OPPORTUNITY
  </div>

  <div class="points">

    <div class="point">
      ✅ PROPER RISK<br>
      MANAGEMENT ✅
    </div>

    <div class="point">
      ☑️ DAILY 3–4 FREE CALLS ☑️
    </div>

  </div>

  <div class="join-text">
    ⚡ CLICK BELOW TO JOIN NOW FREE! ⚡
  </div>

  <a class="join-btn"
     href="https://t.me/+6uKndNKGRNtmZTFl">
     JOIN NOW TELEGRAM<br>
     CHANNEL
  </a>

</div>

</body>
</html>
